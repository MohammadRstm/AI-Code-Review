<!DOCTYPE html>
<html>
  <head>
    <title>Teasting</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 40px;
      }

      .btn {
        background-color: #4CAF50;
        color: white;
        padding: 10px 20px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
      }

      .btn:hover {
        background-color: #45a049;
      }

      table {
        width: 100%;
        margin-top: 25px;
        border-collapse: collapse;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      }

      th, td {
        border: 1px solid #ddd;
        padding: 10px;
        text-align: left;
      }

      th {
        background-color: #4CAF50;
        color: white;
      }

      tr:nth-child(even) {
        background-color: #f2f2f2;
      }
    </style>
  </head>

  <body>
    <h2>Hello on Testing </h2>
    <button id="Testingbtn" class="btn">Testing</button>

    <div id="tableContainer"></div>
    <script src="./script/axios.min.js"></script>
    <script src="./script/Testingscript.js"></script>
    
  </body>
</html>
