<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./styles/styles.css"/>
  <link rel="stylesheet" href="./styles/index.css"/>
  <title>AI Code Reviewer</title>
</head>
<body>
  <header class="site-header">
    <div class="header-container">
      <div class="logo">
        <a href="index.html">AI Code Reviewer</a>
      </div>
      <nav class="header-nav">
        <a href="humanReview.html">Human Review</a>
        <a href="Testing.html">Ai-Tester</a>
      </nav>
    </div>
  </header>

  <section class="ai-review-section">
    <h2>Submit Code or File for Review</h2>
    
    <textarea id="codeInput" placeholder="Paste your code or text here..." rows="8"></textarea>
    
    <div class="divider">OR</div>

    <!-- Buttons + File Input Container -->
    <div class="input-actions">
      <input type="file" id="fileInput" accept=".txt,.js,.php,.py,.java"/>
      <div class="btns">
        <button id="submitBtn" class="btn">Submit</button>
        <button id="clearBtn" class="btn">Clear</button>
      </div>
    </div>

    <div id="resultTableContainer"></div>
  </section>

  <script src="./scripts/axios.min.js"></script>
  <script src="./scripts/index.js" type="module"></script>
</body>
</html>
